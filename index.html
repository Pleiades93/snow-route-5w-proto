        feats.push({ type: 'Feature', properties: { name: n, col: mute(colOf(n, pieces[n][start])) }, geometry: { type: 'LineString', coordinates: GJ(g.stitched.slice(g.cuts[start][0], g.cuts[i - 1][1] + 1)) } });
        start = i;
      }
    }
  });
  return { type: 'FeatureCollection', features: feats };
}
function buildEdges() {
  const feats = [];
  names.forEach(n => {
    const g = GEO[n];
    [g.off0, g.off1].forEach((off, side) => {
      let start = -1;
      for (let i = 0; i <= pieces[n].length; i++) {
        const on = i < pieces[n].length && !!(pieces[n][i] & (1 << side));
        if (on && start < 0) start = i;
        if (!on && start >= 0) { feats.push({ type: 'Feature', properties: { name: n, side, col: MUGREEN }, geometry: { type: 'LineString', coordinates: GJ(off.slice(g.cuts[start][0], g.cuts[i - 1][1] + 1)) } }); start = -1; }
      }
    });
  });
  return { type: 'FeatureCollection', features: feats.concat(buildLinks()) };
}
function buildSel(which) {   // the selected sector, drawn by the overlay stack
  const feats = [];
  if (sel) {
    const g = GEO[sel.name], ab = g.cuts[sel.idx], bits = pieces[sel.name][sel.idx];
    if (which === 'c') feats.push({ type: 'Feature', properties: { col: colOf(sel.name, bits) }, geometry: { type: 'LineString', coordinates: GJ(g.stitched.slice(ab[0], ab[1] + 1)) } });
    else [g.off0, g.off1].forEach((off, side) => { if (bits & (1 << side)) feats.push({ type: 'Feature', properties: { col: GREEN }, geometry: { type: 'LineString', coordinates: GJ(off.slice(ab[0], ab[1] + 1)) } }); });
  }
  return { type: 'FeatureCollection', features: feats };
}
const HIT = { type: 'FeatureCollection', features: names.flatMap(n => GEO[n].cuts.map((ab, i) => ({ type: 'Feature', properties: { name: n, idx: i }, geometry: { type: 'LineString', coordinates: GJ(GEO[n].stitched.slice(ab[0], ab[1] + 1)) } }))) };
let CUR = null;
function rebuildData() { CUR = { centres: buildCentres(), edges: buildEdges(), sel: buildSel('c'), selEdges: buildSel('e') }; }

function applyMixed() {
  pieces = freshPieces();
  const set = (n, i, v) => { if (pieces[n] && pieces[n][i] !== undefined) pieces[n][i] = v; };
  for (let i = 0; i < 6; i++) set('Velmar', i, 3);          // first half of Velmar fully done
  set('Velmar', 6, 1); set('Velmar', 7, 2);                  // then one side each way
  pieces['Mellings'] = pieces['Mellings'].map(() => 3);      // a main road complete
  set('Santa Barbara', 0, 3); set('Santa Barbara', 1, 3); set('Santa Barbara', 2, 1);
  pieces['Columbus'] = pieces['Columbus'].map(() => 3);
  set('Dianawood', 2, 1); set('Fifth', 0, 2); set('Blackburn', 3, 3); set('Blackburn', 4, 1);
  sel = { name: 'Velmar', idx: 6 };
}
applyMixed();
rebuildData();

// ================= map & treatments =================
const STYLES = { day: 'https://tiles.openfreemap.org/styles/positron', night: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json' };
const surfW = ['interpolate', ['linear'], ['zoom'], 14, 2.5, 16, 6.5, 17, 9.5, 18, 15, 19, 24];
let map = null, treatment = 1, baseMode = 'day', fontStack = ['Noto Sans Regular'];

function firstSymbolId() {
  const ls = map.getStyle().layers;
  const s = ls.find(l => l.type === 'symbol');
  return s ? s.id : undefined;
}
function addStack() {
  if (!map.getSource('centres')) {
    map.addSource('centres', { type: 'geojson', data: CUR.centres });
    map.addSource('edges', { type: 'geojson', data: CUR.edges });
    map.addSource('sel', { type: 'geojson', data: CUR.sel });
    map.addSource('selEdges', { type: 'geojson', data: CUR.selEdges });
    map.addSource('hit', { type: 'geojson', data: HIT });
    map.addSource('labels', { type: 'geojson', data: LABELS });
  }
  const before = firstSymbolId();
  const add = (layer) => { if (!map.getLayer(layer.id)) map.addLayer(layer, before); };
  const line = (id, source, paint, layout, filter) => { const o = { id, type: 'line', source, layout: Object.assign({ 'line-cap': 'round', 'line-join': 'round' }, layout || {}), paint }; if (filter) o.filter = filter; return o; };   // NOTE: a present-but-undefined `filter` key makes MapLibre silently drop the layer (found by the QA tour, 2026-10-28)
  // --- T0: the current tracker look, reproduced in GL (the control) ---
  add(line('t0-centre', 'centres', { 'line-color': ['get', 'col'], 'line-width': ['interpolate', ['linear'], ['zoom'], 14, 3.5, 19, 7], 'line-opacity': 0.9 }));
  add(line('t0-edge', 'edges', { 'line-color': ['get', 'col'], 'line-width': 3.5, 'line-opacity': 0.9 }));
  // --- T1: integrated — the road surface itself carries the state ---
  add(line('t1-casing', 'centres', { 'line-color': baseMode === 'night' ? '#000000' : '#5a5f6a', 'line-width': ['interpolate', ['linear'], ['zoom'], 14, 4.5, 16, 9, 17, 12.5, 18, 18.5, 19, 28], 'line-opacity': baseMode === 'night' ? 0.55 : 0.4 }));
  add(line('t1-surface', 'centres', { 'line-color': ['get', 'col'], 'line-width': surfW, 'line-opacity': 0.92 }));
  add(line('t1-edge', 'edges', { 'line-color': ['get', 'col'], 'line-width': 3, 'line-opacity': 0.95 }));
  // --- T2: glow accent — basemap roads untouched, light instead of paint ---
  add(line('t2-glow', 'centres', { 'line-color': ['get', 'col'], 'line-width': 13, 'line-opacity': 0.3, 'line-blur': 8 }));
  add(line('t2-core', 'centres', { 'line-color': ['get', 'col'], 'line-width': 3.4, 'line-opacity': 0.95 }));
  add(line('t2-edgeglow', 'edges', { 'line-color': ['get', 'col'], 'line-width': 10, 'line-blur': 6, 'line-opacity': 0.5 }));
  add(line('t2-edge', 'edges', { 'line-color': ['get', 'col'], 'line-width': 3.2, 'line-opacity': 0.95 }));
  // --- selection overlay: the base spec redrawn in the VIBRANT colour -
  // identical widths and glow, so the only difference is the colour pop ---
  add(line('t0-sel', 'sel', { 'line-color': ['get', 'col'], 'line-width': ['interpolate', ['linear'], ['zoom'], 14, 3.5, 19, 7], 'line-opacity': 0.9 }));
  add(line('t0-sele', 'selEdges', { 'line-color': ['get', 'col'], 'line-width': 3.5, 'line-opacity': 0.9 }));
  add(line('t1-sel', 'sel', { 'line-color': ['get', 'col'], 'line-width': surfW, 'line-opacity': 0.92 }));
  add(line('t1-sele', 'selEdges', { 'line-color': ['get', 'col'], 'line-width': 3, 'line-opacity': 0.95 }));
  add(line('t2-selglow', 'sel', { 'line-color': ['get', 'col'], 'line-width': 13, 'line-blur': 8, 'line-opacity': 0.3 }));
  add(line('t2-sel', 'sel', { 'line-color': ['get', 'col'], 'line-width': 3.4, 'line-opacity': 0.95 }));
  add(line('t2-seleglow', 'selEdges', { 'line-color': ['get', 'col'], 'line-width': 10, 'line-blur': 6, 'line-opacity': 0.5 }));
  add(line('t2-sele', 'selEdges', { 'line-color': ['get', 'col'], 'line-width': 3.2, 'line-opacity': 0.95 }));
  // --- hit + labels (every treatment) ---
  add(line('hit', 'hit', { 'line-color': '#fff', 'line-width': 24, 'line-opacity': 0 }));
  if (!map.getLayer('streetnames')) {   // id must not contain 'label': the app's glHideLabels rule would hide it (found by the label probe, 2026-10-28)
    map.addLayer({ id: 'streetnames', type: 'symbol', source: 'labels', layout: { 'symbol-placement': 'line', 'text-field': ['get', 'name'], 'text-font': fontStack, 'text-size': ['interpolate', ['linear'], ['zoom'], 14, 7.5, 16, 10.5, 18, 20], 'text-rotation-alignment': 'map', 'text-pitch-alignment': 'viewport' }, paint: { 'text-color': baseMode === 'night' ? '#e8e8e8' : '#333333', 'text-halo-color': baseMode === 'night' ? 'rgba(0,0,0,.8)' : 'rgba(255,255,255,.9)', 'text-halo-width': 1.4 } });
  }
  glHideLabels(map);
  applyStates();
  setTreatment(treatment);
}
function setTreatment(t) {
  treatment = t;
  document.querySelectorAll('[data-treat]').forEach(b => b.classList.toggle('on', +b.dataset.treat === t));
  if (!map || !map.getLayer('t0-centre')) return;
  ['t0', 't1', 't2'].forEach((p, i) => {
    map.getStyle().layers.filter(l => l.id.startsWith(p + '-')).forEach(l => map.setLayoutProperty(l.id, 'visibility', i === t ? 'visible' : 'none'));
  });
}
function applyStates() {
  rebuildData();
  if (map && map.getSource('centres')) {
    map.getSource('centres').setData(CUR.centres);
    map.getSource('edges').setData(CUR.edges);
    map.getSource('sel').setData(CUR.sel);
    map.getSource('selEdges').setData(CUR.selEdges);
  }
  renderStatus();
}
function streetDone(n) { return pieces[n].every(b => b === 3); }
function renderStatus() {
  const el = document.getElementById('status');
  const a = document.getElementById('sideA'), b = document.getElementById('sideB'), sd = document.getElementById('streetDone'), sr = document.getElementById('streetReset');
  if (!sel) { el.textContent = 'Tap a street on the map.'; a.disabled = b.disabled = sd.disabled = sr.disabled = true; return; }
  const bits = pieces[sel.name][sel.idx], total = pieces[sel.name].length;
  const lb = LEFTBIT[sel.name], rb = 1 - lb;
  const sideTxt = v => v ? 'done ✓' : 'not done';
  el.innerHTML = '<b>' + sel.name + '</b> — stretch ' + (sel.idx + 1) + ' of ' + total + ' · Left (' + LEFTSIDE[sel.name] + ') ' + sideTxt(bits & (1 << lb)) + ' · Right ' + sideTxt(bits & (1 << rb)) + (streetDone(sel.name) ? ' · street complete' : '');
  a.textContent = 'Left ' + (bits & (1 << lb) ? '✓' : ''); b.textContent = 'Right ' + (bits & (1 << rb) ? '✓' : '');
  a.disabled = b.disabled = sd.disabled = sr.disabled = false;
}

// ================= init & controls =================
const allPts = [];
Object.values(ROADS).forEach(segs => segs.forEach(sg => sg.forEach(p => allPts.push(p))));
const lats = allPts.map(p => p[0]), lngs = allPts.map(p => p[1]);
const BOUNDS = [[Math.min(...lngs), Math.min(...lats)], [Math.max(...lngs), Math.max(...lats)]];
const CENTRE = [(BOUNDS[0][0] + BOUNDS[1][0]) / 2, (BOUNDS[0][1] + BOUNDS[1][1]) / 2];
const reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function pickFont() {
  try {
    const syms = map.getStyle().layers.filter(l => l.type === 'symbol' && l.layout && l.layout['text-font']);
    const road = syms.find(l => /road|highway/.test(l.id));
    const pick = road || syms[0];
    if (pick) fontStack = pick.layout['text-font'];
  } catch (e) {}
}
function init() {
  try {
    map = new maplibregl.Map({ container: 'map', style: STYLES.day, bounds: BOUNDS, fitBoundsOptions: { padding: 24 }, attributionControl: { compact: true }, fadeDuration: 0 });
  } catch (e) {
    document.getElementById('nogl').style.display = 'block';
    document.getElementById('status').textContent = 'The vector map could not start in this browser.';
    return;
  }
  map.on('load', () => { pickFont(); addStack(); document.getElementById('status').textContent = 'Map loaded.'; renderStatus(); });
  map.on('error', e => { if (e && e.error && /webgl/i.test(String(e.error.message || ''))) document.getElementById('nogl').style.display = 'block'; });
  map.on('click', e => {
    const fs = map.queryRenderedFeatures(e.point, { layers: ['hit'] });
    if (fs && fs.length) { sel = { name: fs[0].properties.name, idx: fs[0].properties.idx }; applyStates(); }
  });
}
document.querySelectorAll('[data-treat]').forEach(b => b.addEventListener('click', () => setTreatment(+b.dataset.treat)));
document.querySelectorAll('[data-base]').forEach(b => b.addEventListener('click', () => {
  if (b.dataset.base === baseMode || !map) return;
  baseMode = b.dataset.base;
  document.querySelectorAll('[data-base]').forEach(x => x.classList.toggle('on', x.dataset.base === baseMode));
  map.setStyle(STYLES[baseMode]);
  // Re-adding the route stack after a style swap: 'style.load' never fired
  // on MapLibre 4.7.1 and isStyleLoaded() never settled (swap tests,
  // 2026-10-28). Gate on the observable state instead: the new style is
  // live when its layers exist and our sources are gone.
  let done = false;
  const waiter = () => {
    if (done) return;
    const st = map.getStyle();
    if (st && st.layers && st.layers.length > 0 && !map.getSource('centres')) { done = true; map.off('styledata', waiter); pickFont(); addStack(); }
  };
  map.on('styledata', waiter); waiter();
  setTimeout(() => { if (!done && !map.getSource('centres')) { done = true; pickFont(); addStack(); } }, 12000);
}));
document.querySelectorAll('[data-zoom]').forEach(b => b.addEventListener('click', () => {
  if (!map) return;
  const z = +b.dataset.zoom;
  if (reducedMotion) map.jumpTo({ center: CENTRE, zoom: z }); else map.flyTo({ center: CENTRE, zoom: z, duration: 650 });
}));
document.querySelectorAll('[data-preset]').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('[data-preset]').forEach(x => x.classList.toggle('on', x === b));
  if (b.dataset.preset === 'fresh') { pieces = freshPieces(); sel = null; }
  else if (b.dataset.preset === 'done') { pieces = freshPieces(); names.forEach(n => { pieces[n] = pieces[n].map(() => 3); }); }
  else applyMixed();
  applyStates();
}));
const toggleSide = bit => { if (!sel) return; pieces[sel.name][sel.idx] ^= bit; applyStates(); };
document.getElementById('sideA').addEventListener('click', () => { if (sel) toggleSide(1 << LEFTBIT[sel.name]); });
document.getElementById('sideB').addEventListener('click', () => { if (sel) toggleSide(1 << (1 - LEFTBIT[sel.name])); });
document.getElementById('streetDone').addEventListener('click', () => { if (!sel) return; pieces[sel.name] = pieces[sel.name].map(() => 3); applyStates(); });
document.getElementById('streetReset').addEventListener('click', () => { if (!sel) return; pieces[sel.name] = pieces[sel.name].map(() => 0); applyStates(); });
init();
</script>
</body>
</html>
